<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="login-page"><div class="login-card"><div class="brand">Student<span>Desk</span></div><h1>Welcome back</h1><p class="muted">Sign in to manage student records.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><div class="field"><label>Username</label><input name="username" required autocomplete="username" placeholder="Enter admin username"></div><div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password" placeholder="Enter password"></div><button class="btn" style="width:100%">Sign in</button></form><p class="muted" style="font-size:12px;margin-top:20px">Set ADMIN_USERNAME and ADMIN_PASSWORD before deployment.</p></div></body></html>
