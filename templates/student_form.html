{% extends "base.html" %}{% block title %}{{ page_title }}{% endblock %}{% block heading %}{{ page_title }}{% endblock %}{% block content %}
<div class="panel form-panel"><form method="post"><div class="field"><label>Full Name</label><input name="name" required minlength="3" pattern="[A-Za-z ]+" value="{{ request.form.get('name', student.name if student else '') }}" placeholder="Enter student's full name"></div><div class="field"><label>Mobile Number</label><input name="mobile" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" value="{{ request.form.get('mobile', student.mobile if student else '') }}" placeholder="10-digit mobile number"></div><div class="field"><label>Email Address</label><input type="email" name="email" required value="{{ request.form.get('email', student.email if student else '') }}" placeholder="student@example.com"></div><div class="field"><label>Course</label><select name="course" required><option value="">Select a course</option>{% for c in courses %}<option value="{{ c }}" {{ 'selected' if request.form.get('course', student.course if student else '')==c else '' }}>{{ c }}</option>{% endfor %}</select></div><button class="btn">{{ 'Save Changes' if student else 'Register Student' }}</button> <a class="btn secondary" href="{{ url_for('students') }}">Cancel</a></form></div>
{% endblock %}
